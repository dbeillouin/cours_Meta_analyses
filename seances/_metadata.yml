format:
  revealjs:
    theme: [default, ../../theme/cesab.scss]
    width: 1600
    height: 900
    margin: 0.06
    slide-number: c/t
    show-slide-number: all
    hash-type: number
    transition: fade
    transition-speed: fast
    background-transition: fade
    center: false
    embed-resources: true
    auto-stretch: false
    html-math-method: mathml
    navigation-mode: linear
    progress: true
    controls: true
    controls-layout: bottom-right
    preview-links: auto
    link-external-newwindow: true
    chalkboard: false
    menu:
      side: left
    title-slide-attributes:
      data-background-image: ../../theme/img/bg-title.jpg
      data-background-size: cover
    fig-align: center
    fig-dpi: 200
    citations-hover: true
    reference-location: document
author:  "Damien Beillouin"
institute: "CIRAD, UPR HortSys"
